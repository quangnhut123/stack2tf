[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stack2tf"
version = "0.1.0"
description = "Run HCP Terraform Stacks with plain Terraform / OpenTofu"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "stack2tf contributors" }]
keywords = ["terraform", "opentofu", "stacks", "iac", "orchestration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Environment :: Console",
]
dependencies = ["python-hcl2>=8,<9"]

[project.urls]
Homepage = "https://github.com/quangnhut123/stack2tf"
Repository = "https://github.com/quangnhut123/stack2tf"
Changelog = "https://github.com/quangnhut123/stack2tf/blob/main/CHANGELOG.md"
Issues = "https://github.com/quangnhut123/stack2tf/issues"

[project.scripts]
stack2tf = "stack2tf:main"

[tool.setuptools]
py-modules = ["stack2tf", "stackrun", "stackparse", "hclexpr"]
