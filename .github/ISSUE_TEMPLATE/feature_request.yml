name: Feature request
description: Suggest an idea or enhancement for stack2tf
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what's missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like stack2tf to do? Include example commands/flags if relevant.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
