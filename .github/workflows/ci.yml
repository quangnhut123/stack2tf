name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps + run translator self-tests
        run: |
          pip install -r requirements.txt
          python hclexpr.py
      - name: Whole-stack plan on the bundled fixture (no cloud) via the action
        uses: ./
        with:
          command: plan
          chdir: examples/local-stack
