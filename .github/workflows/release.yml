name: Release to PyPI

# Publishes the package when a GitHub Release is published, using PyPI Trusted
# Publishing (OIDC) — no API token/secret required.
#   * Release marked "pre-release"  -> TestPyPI  (https://test.pypi.org)
#   * Normal release                -> PyPI      (https://pypi.org)
# One-time setup: add a trusted publisher on BOTH PyPI and TestPyPI for
# owner=<org>, repo=<repo>, workflow=release.yml, environment=pypi / testpypi.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        run: |
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "release tag: $TAG   pyproject version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag ($TAG) does not match pyproject version ($PKG)"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*        # validate metadata + README rendering

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi-publish:
    name: Publish to TestPyPI (pre-releases)
    needs: build
    if: ${{ github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/stack2tf/
    permissions:
      id-token: write        # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi-publish:
    name: Publish to PyPI (final releases)
    needs: build
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stack2tf/
    permissions:
      id-token: write        # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
