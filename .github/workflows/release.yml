name: Release to PyPI

# Automatic versioning: every push to main computes the next version from the
# commits since the last tag, creates that tag, and publishes to PyPI. The
# version is derived from git tags via setuptools-scm — nothing is committed
# back to main (works with branch protection).
#
# Bump rules (Conventional Commits, patch is the default so every merge bumps):
#   feat:            -> minor
#   BREAKING CHANGE  -> major   (or a "!" after the type, e.g. feat!: )
#   anything else    -> patch
# Put "[skip release]" in the merge commit to skip a release.
#
# Publishing uses PyPI Trusted Publishing (OIDC) — no token/secret.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          git fetch --tags --force
          LAST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LAST" ]; then LASTV="0.0.0"; RANGE=""; else LASTV="${LAST#v}"; RANGE="$LAST..HEAD"; fi
          LOG=$(git log --format='%s%n%b' $RANGE)
          if [ -n "$RANGE" ] && [ -z "$(git log --oneline $RANGE)" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "::notice::No new commits since $LAST."; exit 0
          fi
          if echo "$LOG" | grep -qiE '\[skip release\]'; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "::notice::[skip release] found."; exit 0
          fi
          if echo "$LOG" | grep -qE 'BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:'; then BUMP=major
          elif echo "$LOG" | grep -qE '^feat(\([^)]+\))?:'; then BUMP=minor
          else BUMP=patch; fi
          IFS=. read -r MA MI PA <<< "$LASTV"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          NEXT="$MA.$MI.$PA"
          echo "::notice::Releasing v$NEXT ($BUMP bump from v$LASTV)"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

  build:
    name: Tag and build
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # push the tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          git tag "v$V"
          git push origin "v$V"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel (version from the new tag)
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stack2tf/
    permissions:
      id-token: write          # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release-notes:
    name: GitHub Release
    needs: [version, pypi-publish]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: gh release create "v$V" --title "v$V" --generate-notes
