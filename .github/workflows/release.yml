name: Release to PyPI

# Publishes the package to PyPI when a GitHub Release is published, using PyPI
# Trusted Publishing (OIDC) — no API token/secret required.
# One-time setup: add a trusted publisher on PyPI for
# owner=<org>, repo=<repo>, workflow=release.yml, environment=pypi.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        run: |
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "release tag: $TAG   pyproject version: $PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag ($TAG) does not match pyproject version ($PKG)"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*        # validate metadata + README rendering

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stack2tf/
    permissions:
      id-token: write        # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
