name: Release to PyPI

# Auto-release: on every push to main, publish to PyPI **only if** the version
# in pyproject.toml has been bumped (i.e. no git tag v<version> exists yet).
# Trivial merges without a version bump are a no-op, so PyPI never sees a
# duplicate upload. Uses PyPI Trusted Publishing (OIDC) — no token/secret.
#
# Release flow: bump `version` in pyproject.toml (and update CHANGELOG.md) in
# your PR; when it merges to main, this tags v<version>, publishes to PyPI, and
# creates the GitHub Release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: decide
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION already released — skipping."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New version v$VERSION — releasing."
          fi

  build:
    name: Build distributions
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stack2tf/
    permissions:
      id-token: write        # trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  finalize:
    name: Tag + GitHub Release
    needs: [check, pypi-publish]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create tag + release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes
